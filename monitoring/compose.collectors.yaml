services:
  celery-exporter:
    profiles: ["celery"]
    build:
      context: .
      dockerfile: celery-exporter.Dockerfile
    restart: unless-stopped
    environment:
      CE_BROKER_URL: ${CE_BROKER_URL:-}
    command:
      - --broker-transport-option
      - "global_keyprefix=${CELERY_KEY_PREFIX:-}"
      - --queues
      - "${CELERY_QUEUE_NAME:-}"
      - --retry-interval
      - "5"
    networks: [broker]
networks:
  broker:
    external: true
    name: ${EVERUNFOLD_MONITOR_NETWORK:-1panel-network}
