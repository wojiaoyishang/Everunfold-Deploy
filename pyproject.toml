[project]
name = "everunfold-deploy"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["textual==8.2.8", "asyncpg==0.32.0", "redis==6.4.0", "argon2-cffi==25.1.0", "PyYAML==6.0.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["deploy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]
